<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>単語帳</title>
  <style>
    :root {
      --bg:#0f1115; --card:#1a1e27; --card2:#222836; --text:#eceff4;
      --muted:#9aa4b2; --accent:#4f8cff; --green:#2fbf71; --red:#e5533c;
      --border:#2b3240; --orange:#f59e0b; --radius:18px;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f4f5f7; --card:#fff; --card2:#eef1f5; --text:#1a1d24; --muted:#68707d; --border:#dfe3e8; }
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif}
    body{max-width:680px;margin:0 auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    button,input,textarea{font:inherit}
    button{border:0;cursor:pointer;font-weight:700;border-radius:14px}
    button:disabled{opacity:.5;cursor:default}
    .hidden{display:none!important}
    .wrap{min-height:100vh;padding:16px;display:flex;flex-direction:column}
    header{text-align:center;padding:10px 0 18px}
    header h1{font-size:22px;margin:0}
    header p{font-size:13px;color:var(--muted);margin:5px 0 0}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
    .stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
    .stat .n{font-size:30px;font-weight:800}.stat .l{font-size:12px;color:var(--muted);margin-top:4px}
    .actions{display:flex;flex-direction:column;gap:10px}
    .primary{background:var(--accent);color:#fff;padding:17px;font-size:17px}
    .secondary{background:var(--card2);color:var(--text);padding:15px;font-size:15px;border:1px solid var(--border)}
    .danger{background:rgba(229,83,60,.15);color:var(--red);border:1px solid rgba(229,83,60,.35)}
    .success{background:rgba(47,191,113,.15);color:var(--green);border:1px solid rgba(47,191,113,.35)}
    .muted{color:var(--muted)}
    .home-note{font-size:12px;color:var(--muted);line-height:1.6;text-align:center;margin-top:15px}
    .link{display:block;text-align:center;color:var(--accent);text-decoration:none;font-size:14px;margin-top:14px}
    .session-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
    .progress{flex:1;height:7px;background:var(--card2);border-radius:999px;overflow:hidden}
    .progress>div{height:100%;background:var(--accent);width:0;transition:width .2s}
    .counter{font-size:12px;color:var(--muted);min-width:54px;text-align:right}
    .tool{width:38px;height:38px;background:var(--card2);color:var(--text);font-size:17px;border:1px solid var(--border)}
    .tool.on{color:var(--orange);border-color:rgba(245,158,11,.45)}
    .mode{font-size:12px;text-align:center;color:var(--muted);margin:0 0 10px}
    .card{flex:1;min-height:360px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
    .badge{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:99px;padding:4px 10px}
    .front{font-size:30px;font-weight:800;line-height:1.35;white-space:pre-wrap;word-break:break-word}
    .divider{width:44px;height:2px;background:var(--border)}
    .back{font-size:21px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
    .notes{font-size:14px;color:var(--muted);border-top:1px dashed var(--border);padding-top:12px;width:100%;white-space:pre-wrap;word-break:break-word}
    .study-actions{display:flex;gap:10px;margin-top:14px}
    .study-actions button{flex:1;padding:17px;font-size:16px}
    .reveal{width:100%;margin-top:14px}
    .empty{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;text-align:center;line-height:1.7;color:var(--muted)}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.58);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
    .panel{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
    .panel h2{font-size:18px;margin:0 0 14px}
    .panel label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
    .panel textarea{width:100%;min-height:92px;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px;resize:vertical}
    .panel .row{display:flex;gap:10px;margin-top:14px}.panel .row button{flex:1;padding:13px}
    .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.3)}
    .spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:30px auto}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🎴 単語帳</h1>
      <p>Google Sheets と同期するシンプルな復習アプリ</p>
    </header>

    <main id="loading"><div class="spinner"></div></main>

    <main id="home" class="hidden">
      <div class="grid">
        <div class="stat"><div class="n" id="due-count">0</div><div class="l">今日の復習</div></div>
        <div class="stat"><div class="n" id="new-count">0</div><div class="l">未学習</div></div>
        <div class="stat"><div class="n" id="mistake-count">0</div><div class="l">今日の間違い</div></div>
        <div class="stat"><div class="n" id="flag-count">0</div><div class="l">要確認</div></div>
      </div>
      <div class="actions">
        <button class="primary" id="start-btn">学習を始める</button>
        <button class="secondary hidden" id="mistakes-btn">今日間違えた問題だけ復習</button>
        <button class="secondary" id="weak-btn">苦手な問題を重点復習</button>
      </div>
      <a id="sheet-link" class="link" href="#" target="_blank" rel="noopener">Google Sheets を開く ↗</a>
      <div class="home-note">カードの追加・CSV取り込みは Google Sheets 側で行います。<br>Mac と iPhone は同じシートを見るため、自動的に同じ学習状態になります。</div>
    </main>

    <main id="empty" class="hidden">
      <div class="empty" id="empty-message">カードがありません。</div>
      <button class="secondary" style="margin-top:12px" onclick="showHome()">ホームに戻る</button>
    </main>

    <main id="session" class="hidden">
      <div class="session-top">
        <button class="tool" id="quit-btn" title="終了">←</button>
        <div class="progress"><div id="progress-fill"></div></div>
        <div class="counter" id="progress-text">0 / 0</div>
        <button class="tool" id="flag-btn" title="要確認">⚑</button>
        <button class="tool" id="edit-btn" title="編集">✎</button>
      </div>
      <div class="mode" id="mode-label"></div>
      <div class="card" id="card-area">
        <div class="badge hidden" id="type-badge"></div>
        <div class="front" id="front"></div>
        <div class="divider hidden" id="divider"></div>
        <div class="back hidden" id="back"></div>
        <div class="notes hidden" id="notes"></div>
      </div>
      <button class="primary reveal" id="reveal-btn">答えを見る</button>
      <div class="study-actions hidden" id="grade-actions">
        <button class="danger" id="wrong-btn">✕ 間違えた</button>
        <button class="success" id="right-btn">○ 正解</button>
      </div>
    </main>
  </div>

  <div class="overlay hidden" id="edit-overlay">
    <div class="panel">
      <h2>カードを編集</h2>
      <label for="edit-front">問題</label>
      <textarea id="edit-front"></textarea>
      <label for="edit-back">答え</label>
      <textarea id="edit-back"></textarea>
      <label for="edit-notes">メモ</label>
      <textarea id="edit-notes"></textarea>
      <div class="row">
        <button class="secondary" id="edit-cancel">キャンセル</button>
        <button class="primary" id="edit-save">保存</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>

<script>
(function () {
  'use strict';

  var sessionData = null;
  var queue = [];
  var index = 0;
  var revealed = false;
  var mode = 'normal';
  var busy = false;

  function $(id) { return document.getElementById(id); }

  function callServer(name, args, ok, fail) {
    var runner = google.script.run
      .withSuccessHandler(ok)
      .withFailureHandler(function (err) {
        busy = false;
        showToast((err && err.message) ? err.message : '処理に失敗しました。');
        if (fail) fail(err);
      });
    runner[name].apply(runner, args || []);
  }

  function setScreen(id) {
    ['loading', 'home', 'empty', 'session'].forEach(function (name) {
      $(name).classList.toggle('hidden', name !== id);
    });
  }

  function loadHome() {
    setScreen('loading');
    callServer('getSession', [], function (data) {
      sessionData = data;
      $('due-count').textContent = data.counts.due || 0;
      $('new-count').textContent = data.counts.fresh || 0;
      $('mistake-count').textContent = data.counts.mistakesToday || 0;
      $('flag-count').textContent = data.counts.flagged || 0;
      $('mistakes-btn').classList.toggle('hidden', !(data.counts.mistakesToday > 0));
      $('sheet-link').href = data.sheetUrl || '#';
      setScreen('home');
    });
  }

  window.showHome = loadHome;

  function startNormal() {
    if (!sessionData || !sessionData.queue || !sessionData.queue.length) {
      showEmpty('今日の学習対象はありません。\n復習日になったカードか未学習カードが追加されると、ここに表示されます。');
      return;
    }
    startQueue(sessionData.queue, 'normal');
  }

  function startMistakes() {
    setScreen('loading');
    callServer('getTodaysMistakes', [50], function (cards) {
      if (!cards || !cards.length) {
        showEmpty('今日間違えたカードはありません。');
        return;
      }
      startQueue(cards, 'mistakes');
    });
  }

  function startWeak() {
    setScreen('loading');
    callServer('getWeakCards', [20], function (cards) {
      if (!cards || !cards.length) {
        showEmpty('苦手判定できる学習済みカードがまだありません。');
        return;
      }
      startQueue(cards, 'weak');
    });
  }

  function startQueue(cards, nextMode) {
    queue = cards.slice();
    index = 0;
    mode = nextMode;
    setScreen('session');
    renderCard();
  }

  function showEmpty(message) {
    $('empty-message').textContent = message;
    setScreen('empty');
  }

  function currentCard() { return queue[index] || null; }

  function renderCard() {
    if (index >= queue.length) {
      showToast('復習が終わりました。');
      loadHome();
      return;
    }

    var card = currentCard();
    revealed = false;
    busy = false;

    $('mode-label').textContent = mode === 'mistakes' ? '今日の間違いだけ復習中' : mode === 'weak' ? '苦手カードを重点復習中' : '通常学習';
    $('progress-text').textContent = (index + 1) + ' / ' + queue.length;
    $('progress-fill').style.width = ((index / queue.length) * 100) + '%';

    $('front').textContent = card.front_side || '';
    $('back').textContent = card.back_side || '';
    $('notes').textContent = card.notes || '';
    $('type-badge').textContent = card.type || '';
    $('type-badge').classList.toggle('hidden', !card.type);

    $('divider').classList.add('hidden');
    $('back').classList.add('hidden');
    $('notes').classList.add('hidden');
    $('reveal-btn').classList.remove('hidden');
    $('grade-actions').classList.add('hidden');
    $('flag-btn').classList.toggle('on', card.flag === '⚑');
  }

  function reveal() {
    if (revealed) return;
    revealed = true;
    $('divider').classList.remove('hidden');
    $('back').classList.remove('hidden');
    $('notes').classList.toggle('hidden', !currentCard().notes);
    $('reveal-btn').classList.add('hidden');
    $('grade-actions').classList.remove('hidden');
  }

  function grade(correct) {
    if (busy) return;
    busy = true;
    var practice = mode !== 'normal';
    var card = currentCard();
    callServer('gradeCard', [card._row, !!correct, practice], function () {
      busy = false;
      index++;
      renderCard();
    });
  }

  function toggleFlag() {
    if (busy) return;
    var card = currentCard();
    var next = card.flag === '⚑' ? '' : '⚑';
    busy = true;
    callServer('updateCard', [card._row, { flag: next }], function () {
      busy = false;
      card.flag = next;
      $('flag-btn').classList.toggle('on', next === '⚑');
      showToast(next ? '要確認に追加しました。' : '要確認を解除しました。');
    });
  }

  function openEditor() {
    var card = currentCard();
    $('edit-front').value = card.front_side || '';
    $('edit-back').value = card.back_side || '';
    $('edit-notes').value = card.notes || '';
    $('edit-overlay').classList.remove('hidden');
  }

  function closeEditor() { $('edit-overlay').classList.add('hidden'); }

  function saveEditor() {
    if (busy) return;
    var card = currentCard();
    var patch = {
      front_side: $('edit-front').value,
      back_side: $('edit-back').value,
      notes: $('edit-notes').value
    };
    if (!patch.front_side.trim() || !patch.back_side.trim()) {
      showToast('問題と答えは空にできません。');
      return;
    }
    busy = true;
    callServer('updateCard', [card._row, patch], function () {
      busy = false;
      card.front_side = patch.front_side;
      card.back_side = patch.back_side;
      card.notes = patch.notes;
      closeEditor();
      renderCard();
      showToast('保存しました。');
    });
  }

  function showToast(message) {
    var toast = $('toast');
    toast.textContent = message;
    toast.classList.remove('hidden');
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(function () { toast.classList.add('hidden'); }, 2200);
  }

  $('start-btn').addEventListener('click', startNormal);
  $('mistakes-btn').addEventListener('click', startMistakes);
  $('weak-btn').addEventListener('click', startWeak);
  $('reveal-btn').addEventListener('click', reveal);
  $('wrong-btn').addEventListener('click', function () { grade(false); });
  $('right-btn').addEventListener('click', function () { grade(true); });
  $('quit-btn').addEventListener('click', loadHome);
  $('flag-btn').addEventListener('click', toggleFlag);
  $('edit-btn').addEventListener('click', openEditor);
  $('edit-cancel').addEventListener('click', closeEditor);
  $('edit-save').addEventListener('click', saveEditor);
  $('edit-overlay').addEventListener('click', function (event) {
    if (event.target === $('edit-overlay')) closeEditor();
  });

  loadHome();
}());
</script>
</body>
</html>
